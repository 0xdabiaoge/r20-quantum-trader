services:
  r20-quantum-trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r20-quantum-trader
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OKX_DEMO=1
      - R20_GATEWAY_WORKER_ENABLED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
